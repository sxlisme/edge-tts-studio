name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  notify-start:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
      BARK_SERVER: ${{ vars.BARK_SERVER || 'https://api.day.app' }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Notify Bark that the build started
        if: env.BARK_DEVICE_KEY != ''
        continue-on-error: true
        run: |
          body=$(printf '引用：%s\n触发人：%s' "$GITHUB_REF_NAME" "$GITHUB_ACTOR")
          payload=$(jq -n \
            --arg key "$BARK_DEVICE_KEY" \
            --arg title "声工坊开始构建" \
            --arg body "$body" \
            --arg url "$RUN_URL" \
            '{
              device_key: $key,
              title: $title,
              body: $body,
              group: "声工坊构建",
              sound: "bell",
              url: $url
            }')

          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --max-time 15 \
            --request POST "$BARK_SERVER/push" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data "$payload"

  build:
    needs: notify-start
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            name: macOS-universal
            args: --target universal-apple-darwin --bundles dmg
          - platform: windows-2022
            name: Windows-x64
            args: --bundles nsis,msi
    runs-on: ${{ matrix.platform }}
    env:
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm run tauri -- build ${{ matrix.args }}
      - name: Normalize installer filenames
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release-files
          shopt -s nullglob

          if [ "$RUNNER_OS" = "macOS" ]; then
            installers=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
            if [ "${#installers[@]}" -ne 1 ]; then
              echo "Expected exactly one macOS DMG, found ${#installers[@]}" >&2
              exit 1
            fi
            cp "${installers[0]}" "release-files/macOS_VoiceStudio_${version}_universal.dmg"
          else
            exe_installers=(src-tauri/target/release/bundle/nsis/*.exe)
            msi_installers=(src-tauri/target/release/bundle/msi/*.msi)
            if [ "${#exe_installers[@]}" -ne 1 ] || [ "${#msi_installers[@]}" -ne 1 ]; then
              echo "Expected one Windows EXE and one MSI, found ${#exe_installers[@]} EXE and ${#msi_installers[@]} MSI" >&2
              exit 1
            fi
            cp "${exe_installers[0]}" "release-files/Windows_VoiceStudio_${version}_x64_setup.exe"
            cp "${msi_installers[0]}" "release-files/Windows_VoiceStudio_${version}_x64_zh-CN.msi"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-VoiceStudio-${{ github.ref_name }}
          path: release-files/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
          generate_release_notes: true
      - name: Add localized asset labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          while IFS=$'\t' read -r asset_id asset_name; do
            case "$asset_name" in
              macOS_VoiceStudio_*.dmg)
                label="苹果电脑_声工坊_${version}_通用版.dmg"
                ;;
              Windows_VoiceStudio_*_setup.exe)
                label="windows_声工坊_${version}_x64安装版.exe"
                ;;
              Windows_VoiceStudio_*_zh-CN.msi)
                label="windows_声工坊_${version}_x64中文版.msi"
                ;;
              *)
                continue
                ;;
            esac
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              -f label="$label" >/dev/null
          done < <(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq '.assets[] | [.id, .name] | @tsv')

  notify-finish:
    if: always()
    needs:
      - build
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
      BARK_SERVER: ${{ vars.BARK_SERVER || 'https://api.day.app' }}
      BUILD_RESULT: ${{ needs.build.result }}
      RELEASE_RESULT: ${{ needs.release.result }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Notify Bark of the build result
        if: env.BARK_DEVICE_KEY != ''
        continue-on-error: true
        run: |
          if [ "$BUILD_RESULT" = "success" ] && \
             { [ "$RELEASE_RESULT" = "success" ] || [ "$RELEASE_RESULT" = "skipped" ]; }; then
            title="声工坊构建成功"
            summary="macOS 和 Windows 安装包已生成"
            sound="minuet"
          else
            title="声工坊构建失败"
            summary="请点击通知查看失败日志"
            sound="alarm"
          fi

          body=$(printf '引用：%s\n%s\n构建：%s，发布：%s' \
            "$GITHUB_REF_NAME" "$summary" "$BUILD_RESULT" "$RELEASE_RESULT")
          payload=$(jq -n \
            --arg key "$BARK_DEVICE_KEY" \
            --arg title "$title" \
            --arg body "$body" \
            --arg sound "$sound" \
            --arg url "$RUN_URL" \
            '{
              device_key: $key,
              title: $title,
              body: $body,
              sound: $sound,
              group: "声工坊构建",
              url: $url
            }')

          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --max-time 15 \
            --request POST "$BARK_SERVER/push" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data "$payload"
