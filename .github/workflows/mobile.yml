name: Android package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag to receive the APK
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Test native TTS protocol and live synthesis
        run: gradle -p android-native :app:testDebugUnitTest --stacktrace
      - name: Build native Android APK
        run: gradle -p android-native :app:assembleDebug --stacktrace
      - name: Normalize APK filename
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          apk_path=$(find android-native/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$apk_path"
          mkdir -p release-files
          cp "$apk_path" "release-files/Android_VoiceStudio_${version}_native-debug.apk"
      - name: Verify native APK integrity, manifest, and signature
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          apk_path=$(find release-files -type f -name '*.apk' -print -quit)
          test -n "$apk_path"
          unzip -tq "$apk_path"
          unzip -l "$apk_path" | grep -Eq 'classes.*\.dex'
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk_path" | grep -E "package: name='com.sxlisme.voicestudio'.*versionName='$version'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk_path"
          sha256sum "$apk_path"
      - uses: actions/upload-artifact@v4
        with:
          name: Android-VoiceStudio-${{ github.ref_name }}
          path: release-files/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*.apk
          generate_release_notes: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
