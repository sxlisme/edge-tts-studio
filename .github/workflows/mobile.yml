name: Android package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag to receive the APK
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run tauri -- android init --ci
      - name: Build installable arm64 APK
        run: npm run tauri -- android build --target aarch64 --apk --debug --ci
      - name: Normalize APK filename
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          apk_path=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$apk_path"
          mkdir -p release-files
          cp "$apk_path" "release-files/Android_VoiceStudio_${version}_arm64-v8a-debug.apk"
      - name: Verify APK integrity, ABI, and signature
        shell: bash
        run: |
          apk_path=$(find release-files -type f -name '*.apk' -print -quit)
          test -n "$apk_path"
          unzip -tq "$apk_path"
          unzip -l "$apk_path" | grep -Eq 'lib/arm64-v8a/.*\.so'
          if unzip -l "$apk_path" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Unexpected non-arm64 native library in $apk_path" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk_path"
          sha256sum "$apk_path"
      - uses: actions/upload-artifact@v4
        with:
          name: Android-VoiceStudio-${{ github.ref_name }}
          path: release-files/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*.apk
          generate_release_notes: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
